<script>
// ── Data ──
let lines = [];        // { id, original, current, deleted, flagged, flagReason, edited }
let currentFilter = 'all';
let customRules = [];

// ── Built-in rules ──
const PARTICLES = /[\s,，]*(嗯+|啊+|哦+|喔+|噢+|唉+|呢|嘛|吧|囉|啦|欸|欸+|哈+|呵+|嗯哼|呃+|額+|那個那個|這個這個)/g;
const REPEAT_WORD = /(.{1,4})\1{1,}/g;

const TYPOS = [
  ['的話', '的話'], // placeholder - add real ones below
  ['在在', '在'],
  ['是是', '是'],
  ['就就', '就'],
  ['然後然後', '然後'],
  ['所以所以', '所以'],
  ['因為因為', '因為'],
];

const UNDERSTAND_PATTERNS = [
  /理解嗎[？?]?/,
  /理解了嗎[？?]?/,
  /了解嗎[？?]?/,
  /了解了嗎[？?]?/,
  /瞭解嗎[？?]?/,
  /瞭解了嗎[？?]?/,
  /懂[嗎了]?[？?]?$/,
  /聽懂嗎[？?]?/,
  /聽懂了嗎[？?]?/,
  /懂我的意思嗎[？?]?/,
  /知道嗎[？?]?/,
  /知道了嗎[？?]?/,
  /知道了吧[？?]?/,
  /明白嗎[？?]?/,
  /明白了嗎[？?]?/,
  /明白了沒有[？?]?/,
  /清楚嗎[？?]?/,
  /清楚了嗎[？?]?/,
  /這樣[懂明白清楚][嗎了]?[？?]?/,
  /這樣子[懂明白清楚][嗎了]?[？?]?/,
  /有沒有[問題疑問][？?]?/,
  /有[問題疑問]嗎[？?]?/,
  /沒有[問題疑問]嗎[？?]?/,
  /跟上了嗎[？?]?/,
  /跟得上嗎[？?]?/,
  /記住了嗎[？?]?/,
  /學會了嗎[？?]?/,
  /對不對[？?]?$/,
  /有沒有[？?]?$/,
  /OK[？?]?$/i,
  /ok[嗎了]?[？?]?$/i,
  /好嗎[？?]?$/,
  /是不是[？?]?$/,
  /對吧[？?]?$/,
  /是吧[？?]?$/,
];

// SRT parser
function parseSRT(text) {
  const blocks = text.trim().split(/\n\n+/);
  const result = [];
  for (const b of blocks) {
    const lines = b.split('\n');
    if (lines.length >= 3 && /^\d+$/.test(lines[0].trim()) && lines[1].includes('-->')) {
      result.push(lines.slice(2).join(' ').trim());
    } else {
      // not SRT block, treat as plain
      result.push(...b.split('\n').map(l => l.trim()).filter(Boolean));
      break;
    }
  }
  return result;
}

function parseInput(text) {
  // detect SRT
  if (/^\d+\s*\n\d{2}:\d{2}/.test(text.trim())) {
    return parseSRT(text);
  }
  return text.split('\n').map(l => l.trim()).filter(Boolean);
}

// ── Rule application ──
function applyRules(text) {
  let t = text;

  if (document.getElementById('r_repeat').checked) {
    t = t.replace(/(然後){2,}/g, '然後')
         .replace(/(所以){2,}/g, '所以')
         .replace(/(就是){2,}/g, '就是')
         .replace(/(那個){2,}/g, '那個')
         .replace(/(這個){2,}/g, '這個')
         .replace(/(因為){2,}/g, '因為')
         .replace(/(其實){2,}/g, '其實');
  }

  if (document.getElementById('r_typo').checked) {
    for (const [from, to] of TYPOS) {
      t = t.replaceAll(from, to);
    }
    // apply custom rules
    for (const r of customRules) {
      t = t.replaceAll(r.from, r.to);
    }
  } else {
    // still apply custom rules
    for (const r of customRules) {
      t = t.replaceAll(r.from, r.to);
    }
  }

  if (document.getElementById('r_particles').checked) {
    t = t.replace(/^[\s,，]*(嗯+|啊+|哦+|喔+|噢+|欸+|呃+|額+)[，,\s]*/g, '');
    t = t.replace(/[，,\s]*(嗯+|啊+|哦+|喔+|噢+|欸+|呃+|額+)[，,\s]*$/g, '');
    t = t.replace(/[，,\s]*(嗯+|啊+|哦+|喔+|噢+|欸+|呃+|額+)[，,\s]+/g, '，');
    t = t.replace(/([。？！，])([嗎呢吧囉啦])/g, '$1');
    t = t.replace(/([^。？！])([嗎呢吧囉啦])([。？！])/g, '$1$3');
  }

  t = t.replace(/\s+/g, ' ').trim();
  return t;
}

function checkUnderstand(text) {
  if (!document.getElementById('r_understand').checked) return false;
  return UNDERSTAND_PATTERNS.some(p => p.test(text));
}

// ── Custom rules ──
function addRule() {
  const from = document.getElementById('ruleFrom').value.trim();
  const to = document.getElementById('ruleTo').value.trim();
  if (!from) return;
  customRules.push({ from, to });
  document.getElementById('ruleFrom').value = '';
  document.getElementById('ruleTo').value = '';
  renderCustomRules();
}

function renderCustomRules() {
  const el = document.getElementById('customRules');
  el.innerHTML = customRules.map((r, i) => `
    <div class="rule-item">
      <span>「${r.from}」→ 「${r.to || '<em>刪除</em>'}」</span>
      <div class="del" onclick="removeRule(${i})">×</div>
    </div>
  `).join('');
}

function removeRule(i) {
  customRules.splice(i, 1);
  renderCustomRules();
}

// ── Process ──
async function runProcess() {
  const raw = document.getElementById('inputText').value;
  if (!raw.trim()) return;

  const rawLines = parseInput(raw);
  lines = rawLines.map((l, i) => {
    const current = applyRules(l);
    const flagged = checkUnderstand(current);
    return {
      id: i,
      original: l,
      current,
      deleted: false,
      flagged,
      flagReason: flagged ? '確認理解' : '',
      edited: l !== current
    };
  });

  renderLines();

  if (document.getElementById('useAI').checked) {
    await runAI();
  }
}

async function runAI() {
  const container = document.getElementById('linesContainer');
  const loadDiv = document.createElement('div');
  loadDiv.className = 'ai-loading';
  loadDiv.innerHTML = '<div class="spinner"></div> AI 正在分析語句中⋯';
  container.prepend(loadDiv);

  const toAnalyze = lines.filter(l => !l.deleted && !l.flagged).map(l => `${l.id}|||${l.current}`).join('\n');

  try {
    const resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: `你是字幕品質審閱助理。請分析以下字幕行，找出「確認理解類」句子，例如：理解嗎、了解嗎、懂嗎、知道嗎、明白嗎、這樣OK嗎、有問題嗎，或其他功能為「確認聽眾是否理解」的句子。
每行格式：行號|||文字
請只回傳需要標記的行號，以逗號分隔，例如：2,5,8
如果沒有需要標記的，回傳空字串。`,
        messages: [{ role: 'user', content: toAnalyze }]
      })
    });

    const data = await resp.json();
    const text = data.content?.[0]?.text?.trim() || '';
    const flaggedIds = text.split(',').map(s => parseInt(s.trim())).filter(n => !isNaN(n));

    for (const id of flaggedIds) {
      const l = lines.find(x => x.id === id);
      if (l) { l.flagged = true; l.flagReason = '確認理解（AI）'; }
    }
  } catch (e) {
    console.warn('AI 分析失敗', e);
  }

  loadDiv.remove();
  renderLines();
}

// ── Render ──
function renderLines() {
  const container = document.getElementById('linesContainer');
  const visible = lines.filter(l => {
    if (currentFilter === 'flagged') return l.flagged && !l.deleted;
    if (currentFilter === 'deleted') return l.deleted;
    return true;
  });

  if (visible.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">✅</div><p>沒有符合條件的行</p></div>';
    updateStats();
    return;
  }

  container.innerHTML = visible.map(l => renderLine(l)).join('');
  updateStats();
}

function renderLine(l) {
  const cls = [l.deleted ? 'deleted' : '', l.flagged && !l.deleted ? 'flagged' : ''].filter(Boolean).join(' ');
  const diff = l.original !== l.current && !l.deleted
    ? `<div class="diff-view"><del>${escHtml(l.original)}</del> → <ins>${escHtml(l.current)}</ins></div>`
    : '';
  const badge = '';

  return `<div class="line-item ${cls}" id="li_${l.id}">
    <div class="line-num">${l.id + 1}</div>
    <div style="flex:1;min-width:0">
      <div class="line-text">${escHtml(l.current)}</div>
      ${diff}
    </div>
    ${badge}
    <div class="line-actions">
      ${!l.deleted ? `<div class="act-btn" title="編輯" onclick="editLine(${l.id})">✏️</div>` : ''}
      <div class="act-btn" title="${l.deleted ? '還原' : '刪除'}" onclick="toggleDelete(${l.id})">${l.deleted ? '↩' : '✕'}</div>
    </div>
  </div>`;
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function updateStats() {
  const total = lines.length;
  const deleted = lines.filter(l => l.deleted).length;
  const flagged = lines.filter(l => l.flagged && !l.deleted).length;
  const edited = lines.filter(l => l.edited && !l.deleted).length;
  document.getElementById('stats').innerHTML =
    `共 <span>${total}</span> 行 ／ 待審 <span style="color:#f59e0b">${flagged}</span> ／ 已改 <span style="color:#10b981">${edited}</span> ／ 刪除 <span style="color:#ef4444">${deleted}</span>`;
}

// ── Actions ──
function toggleDelete(id) {
  const l = lines.find(x => x.id === id);
  if (!l) return;
  l.deleted = !l.deleted;
  document.getElementById(`li_${id}`).outerHTML = renderLine(l);
  updateStats();
}

function editLine(id) {
  const l = lines.find(x => x.id === id);
  const el = document.getElementById(`li_${id}`);
  const textDiv = el.querySelector('.line-text');
  textDiv.innerHTML = `<input class="edit-input" value="${escHtml(l.current)}" onblur="saveEdit(${id},this)" onkeydown="if(event.key==='Enter')this.blur()">`;
  textDiv.querySelector('input').focus();
}

function saveEdit(id, input) {
  const l = lines.find(x => x.id === id);
  l.current = input.value.trim();
  l.edited = l.current !== l.original;
  l.flagged = checkUnderstand(l.current);
  document.getElementById(`li_${id}`).outerHTML = renderLine(l);
  updateStats();
}

function deleteAllFlagged() {
  lines.filter(l => l.flagged && !l.deleted).forEach(l => l.deleted = true);
  renderLines();
}

function filterView(f) {
  currentFilter = f;
  ['all','flagged','deleted'].forEach(x => {
    document.getElementById('f_'+x).style.background = x === f ? '#7c6af7' : '';
    document.getElementById('f_'+x).style.color = x === f ? '#fff' : '';
  });
  renderLines();
}

function exportResult() { exportClean(); }

function toggleExportMenu() {
  const m = document.getElementById('exportMenu');
  m.style.display = m.style.display === 'none' ? 'block' : 'none';
}
document.addEventListener('click', e => {
  if (!document.getElementById('exportWrap').contains(e.target))
    document.getElementById('exportMenu').style.display = 'none';
});

function exportClean() {
  document.getElementById('exportMenu').style.display = 'none';
  const result = lines.filter(l => !l.deleted).map(l => l.current).join('\n');
  download(result, 'cleaned_subtitle.txt');
}

function exportDiff() {
  document.getElementById('exportMenu').style.display = 'none';
  const changed = lines.filter(l => l.edited || l.deleted);
  if (!changed.length) { alert('沒有任何修改紀錄可匯出'); return; }
  const rows = changed.map(l => {
    const status = l.deleted ? '[刪除]' : '[修改]';
    return `${status} 第${l.id + 1}行\n  原文：${l.original}\n  修改：${l.deleted ? '（已刪除）' : l.current}\n`;
  });
  const header = `字幕修改對照表\n生成時間：${new Date().toLocaleString('zh-TW')}\n共 ${changed.length} 筆修改\n${'─'.repeat(40)}\n\n`;
  download(header + rows.join('\n'), 'subtitle_diff.txt');
}

function saveRules() {
  if (!customRules.length) { alert('目前沒有自訂規則可儲存'); return; }
  const data = JSON.stringify({ rules: customRules, savedAt: new Date().toISOString() }, null, 2);
  download(data, 'subtitle_rules.json');
}

function loadRules(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      if (!data.rules || !Array.isArray(data.rules)) throw new Error();
      customRules = data.rules;
      renderCustomRules();
      alert(`已載入 ${customRules.length} 組規則`);
    } catch { alert('規則檔案格式錯誤'); }
  };
  reader.readAsText(f);
  e.target.value = '';
}

function download(text, filename) {
  const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

function clearAll() {
  lines = [];
  document.getElementById('inputText').value = '';
  document.getElementById('linesContainer').innerHTML =
    '<div class="empty-state"><div class="icon">✂️</div><p>在左側貼上字幕文字<br>設定清理規則後按「開始清理」</p></div>';
  document.getElementById('stats').textContent = '尚未處理';
}
</script>
